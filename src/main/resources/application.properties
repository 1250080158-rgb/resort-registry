# Server Configuration
server.port=${PORT:8080}

# Database Configuration - H2 In-Memory for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT (đổi secret qua biến môi trường khi deploy thật)
app.jwt.secret=${APP_JWT_SECRET:resort-registry-dev-secret-key-change-in-production-0123456789abcdef}
app.jwt.expiration-ms=86400000

# Khóa tài khoản sau khi nhập sai mật khẩu
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# Upload ảnh (được phục vụ tại /uploads/**)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Flyway chỉ bật ở profile prod (dev dùng H2 + ddl-auto=update)
spring.flyway.enabled=false

# Email: để trống spring.mail.host = chế độ dev (ghi log thay vì gửi thật)
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
spring.mvc.static-path-pattern=/**