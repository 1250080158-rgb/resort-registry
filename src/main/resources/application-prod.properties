# Profile PROD - SQL Server + Flyway migration
# Chạy: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=prod
# Đặt biến môi trường DB_USER / DB_PASSWORD / JWT_SECRET trước khi chạy.

# Database - SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ResortRegistry;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Schema do Flyway quản, Hibernate chỉ kiểm tra
# defer-datasource-initialization phải tắt ở prod: bật cùng Flyway sẽ gây
# circular depends-on giữa flyway và entityManagerFactory
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=never

# JWT - bắt buộc đặt biến môi trường
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Upload
app.upload.dir=${UPLOAD_DIR:uploads}

# Email (điền SMTP thật khi deploy)
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USER:}
#spring.mail.password=${MAIL_PASSWORD:}

# Tắt SQL debug ở prod
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
